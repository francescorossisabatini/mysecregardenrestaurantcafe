    <!-- Analytics loaders. Analytics scripts are loaded only after explicit, granular consent. -->
    <script>
      function readConsent() {
        try {
          var raw = localStorage.getItem('cookie_consent_v2');
          if (!raw) return null;
          return JSON.parse(raw);
        } catch (e) { return null; }
      }

      function loadAnalytics() {
        var consent = readConsent();
        if (!consent || consent.analytics !== true) return;
        if (window._analyticsLoaded) return;
        window._analyticsLoaded = true;

        var script = document.createElement('script');
        script.src = 'https://www.googletagmanager.com/gtag/js?id=G-NMVX2R7493';
        script.async = true;
        document.head.appendChild(script);

        script.onload = function() {
          window.gtag('js', new Date());
          window.gtag('consent', 'update', { 'analytics_storage': 'granted' });
          window.gtag('config', 'G-NMVX2R7493', { anonymize_ip: true });
        };
      }
      window.loadAnalytics = loadAnalytics;

      function loadContentsquare() {
        var consent = readConsent();
        if (!consent || consent.behavioral !== true) return;
        if (window._contentsquareLoaded) return;
        window._contentsquareLoaded = true;

        var script = document.createElement('script');
        script.src = 'https://t.contentsquare.net/uxa/ec6d26c7759d7.js';
        script.async = true;
        document.head.appendChild(script);
      }
      window.loadContentsquare = loadContentsquare;

      var initialConsent = readConsent();
      if (initialConsent) {
        if ('requestIdleCallback' in window) {
          requestIdleCallback(loadAnalytics, { timeout: 4000 });
          requestIdleCallback(loadContentsquare, { timeout: 4500 });
        } else {
          setTimeout(loadAnalytics, 3000);
          setTimeout(loadContentsquare, 3500);
        }
      }
